<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Early Signs of Pregnancy Pin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .pin-container {
            width: 1000px;
            height: 1500px;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 50%, #a5d6a7 100%);
            padding: 60px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .badge {
            position: absolute;
            top: 40px;
            right: 40px;
            background: #fff;
            color: #2e7d32;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            margin-top: 20px;
        }
        .header h1 {
            font-size: 68px;
            font-weight: 800;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            line-height: 1.1;
            margin-bottom: 15px;
        }
        .header .subtitle {
            font-size: 30px;
            color: #fff;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        .signs {
            background: rgba(255,255,255,0.95);
            border-radius: 30px;
            padding: 45px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .sign-item {
            display: flex;
            align-items: center;
            margin-bottom: 22px;
            font-size: 32px;
            color: #333;
            font-weight: 500;
        }
        .icon {
            width: 55px;
            height: 55px;
            background: #2e7d32;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            margin-right: 20px;
            flex-shrink: 0;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 3px dashed rgba(255,255,255,0.6);
        }
        .footer p {
            font-size: 26px;
            color: #fff;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="pin-container">
        <div class="badge">EARLY SIGNS</div>

        <div class="header">
            <h1>How to Tell<br>If You're Pregnant</h1>
            <div class="subtitle">Before you even miss a period</div>
        </div>

        <div class="signs">
            <div class="sign-item">
                <div class="icon">1</div>
                <span>Implantation bleeding or spotting</span>
            </div>
            <div class="sign-item">
                <div class="icon">2</div>
                <span>Breast tenderness and swelling</span>
            </div>
            <div class="sign-item">
                <div class="icon">3</div>
                <span>Sudden fatigue and tiredness</span>
            </div>
            <div class="sign-item">
                <div class="icon">4</div>
                <span>Frequent urination</span>
            </div>
            <div class="sign-item">
                <div class="icon">5</div>
                <span>Nausea or food aversions</span>
            </div>
            <div class="sign-item">
                <div class="icon">6</div>
                <span>Mood swings and bloating</span>
            </div>
        </div>

        <div class="footer">
            <p>Source: pregnancycalculatorhub.com</p>
        </div>
    </div>
</body>
</html>
